<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=375, initial-scale=1.0">
<title>AR Viewer — Mobile — Traditiontag</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#E0D6C8;margin:0;display:flex;justify-content:center;padding:40px 0;}
.phone{width:375px;height:812px;background:#1A1310;color:#FAF6EF;border-radius:40px;overflow:hidden;box-shadow:0 25px 60px rgba(0,0,0,.25);position:relative;border:8px solid #1A1310;}
.serif{font-family:'Fraunces',serif;}
</style>
</head>
<body>

<div class="phone flex flex-col">
  <!-- Camera sim -->
  <div class="flex-1 relative" style="background:linear-gradient(135deg,#3a3a2a 0%,#5a5a3a 40%,#7a7a5a 100%);">
    <!-- Status bar on dark -->
    <div class="flex justify-between items-center px-6 pt-4 pb-2 text-[10px] text-white/60"><span>9:41</span><div class="flex gap-1"><span>📶</span><span>🔋</span></div></div>

    <!-- Top bar -->
    <div class="flex justify-between items-center px-5 mt-1">
      <a href="product-detail.html" class="text-white/90 text-sm">← Close</a>
      <div class="bg-white/15 backdrop-blur rounded-full px-3 py-1 text-[10px]">⌂ AR Mode</div>
      <button class="text-white/90 text-sm">📸</button>
    </div>

    <!-- Surface detection hint -->
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 text-center">
      <div class="w-32 h-32 border-2 border-dashed border-white/40 rounded-lg flex items-center justify-center mb-3">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1" opacity=".6"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
      <p class="text-white/70 text-xs">Move your phone to detect a surface</p>
      <p class="text-white/40 text-[10px] mt-1">Point at a table, floor, or shelf</p>
    </div>

    <!-- Placed product indicator (shown after detect) -->
    <div class="absolute bottom-36 left-1/2 -translate-x-1/2 bg-[#5C6B3E] text-white px-3 py-1.5 rounded-full text-[10px] flex items-center gap-1.5">
      <span class="w-2 h-2 bg-white rounded-full animate-pulse"></span> Surface detected — tap to place
    </div>
  </div>

  <!-- Bottom controls -->
  <div class="bg-[#1A1310] px-5 pt-4 pb-10">
    <!-- Product chip -->
    <div class="bg-white/10 rounded-lg p-3 flex gap-3 items-center mb-4">
      <div class="w-12 h-12 rounded bg-[#E8D9BE]" style="background:url('https://loremflickr.com/100/100/bidri,vase,silver') center/cover;"></div>
      <div class="flex-1">
        <p class="serif text-sm text-white">Bidriware Vase</p>
        <p class="text-[10px] text-white/50">GI #16 · Telangana</p>
      </div>
      <p class="serif text-sm text-white">₹9,200</p>
    </div>

    <!-- AR controls -->
    <div class="flex gap-3">
      <button class="flex-1 border border-white/30 rounded-lg py-3 text-xs text-center">↻ Rotate</button>
      <button class="flex-1 border border-white/30 rounded-lg py-3 text-xs text-center">⤢ Scale</button>
      <button class="flex-1 border border-white/30 rounded-lg py-3 text-xs text-center">🎨 Variant</button>
    </div>

    <!-- Variant picker -->
    <div class="flex gap-2 justify-center mt-3">
      <button class="w-7 h-7 rounded-full bg-[#2C3E66] ring-2 ring-offset-2 ring-offset-[#1A1310] ring-white/60"></button>
      <button class="w-7 h-7 rounded-full bg-[#B4471F]"></button>
      <button class="w-7 h-7 rounded-full bg-[#5C6B3E]"></button>
    </div>

    <div class="flex gap-3 mt-4">
      <button class="flex-1 border border-white/30 rounded-lg py-3 text-xs">💾 Save Session</button>
      <button class="flex-1 bg-white text-[#1A1310] rounded-lg py-3 text-xs font-medium">Add to Cart</button>
    </div>
  </div>
</div>

</body></html>
